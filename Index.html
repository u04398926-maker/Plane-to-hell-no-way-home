<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLANE TO HELL: NO WAY HOME</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

header {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;

    background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.9)),
        url("game.jpg") center/cover no-repeat;
}

.hero h1 {
    font-size: clamp(38px, 8vw, 80px);
    letter-spacing: 3px;
    text-transform: uppercase;
}

.hero p {
    margin-top: 15px;
    font-size: 18px;
    color: #ccc;
}

.btn {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 30px;
    background: #d62828;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}

section {
    padding: 60px 20px;
    max-width: 1000px;
    margin: auto;
}

h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 32px;
}

.story {
    line-height: 1.8;
    color: #ddd;
    font-size: 17px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: #151515;
    padding: 25px;
    border-radius: 10px;
    border: 1px solid #292929;
}

.card h3 {
    color: #e63946;
    margin-bottom: 12px;
}

.card p {
    color: #ccc;
    line-height: 1.6;
}

footer {
    text-align: center;
    padding: 30px;
    background: #050505;
    color: #777;
}
</style>
</head>

<body>

<header>
    <div class="hero">
        <h1>PLANE TO HELL</h1>
        <p>NO WAY HOME</p>

        <a href="#story" class="btn">EXPLORE THE GAME</a>
    </div>
</header>

<section id="story">
    <h2>THE STORY</h2>

    <div class="story">
